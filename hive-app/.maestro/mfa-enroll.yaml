appId: com.myhbcfo.hive.development
name: First staff login enrolls TOTP (QR + setup key), wrong code recovers, correct code reaches AAL2
# Pre-steps on the runner:
#   1. Seeded stack up; `node scripts/totp-helper.mjs` running (loopback).
#   2. reviewer.rae@example.invalid has NO verified TOTP factor yet
#      (fresh `node scripts/local-supabase.mjs seed`).
#   3. OTP_CODE read from Mailpit for reviewer.rae@example.invalid.
# Secret handling: the setup key belongs to a SYNTHETIC QA account. It is
# copied once, handed to the loopback helper's memory in a POST body
# (never CLI/env/URL), and the clipboard is overwritten immediately after.
# Never screenshot this screen. The wrong code is DERIVED from the real
# one (real+1 mod 10^6), never a constant.
# Device evidence to capture separately: the displayed QR scans
# successfully in a real authenticator app (scan it with the QA device's
# camera authenticator against a throwaway synthetic account).
---
- launchApp:
    clearState: true
- tapOn:
    id: 'sign-in-email'
- inputText: 'reviewer.rae@example.invalid'
- tapOn:
    id: 'sign-in-submit'
- assertVisible: 'Enter your sign-in code'
- tapOn:
    id: 'otp-code'
- inputText: ${OTP_CODE}
- tapOn:
    id: 'otp-submit'
# First-time setup: QR and manual setup key are shown.
- assertVisible: 'Set up your authenticator'
- assertVisible:
    id: 'mfa-enroll-qr'
- assertVisible:
    id: 'mfa-enroll-secret'
- copyTextFrom:
    id: 'mfa-enroll-secret'
# Hand the key to the helper's memory (POST body) and get code+wrongCode.
- runScript: totp-capture.js
# Scrub the clipboard immediately: overwrite the copied secret with the
# harmless on-screen heading.
- copyTextFrom: 'Set up your authenticator'
# A guaranteed-wrong code (derived from the real one) fails safely and
# keeps the enrollment on screen.
- tapOn:
    id: 'mfa-code'
- inputText: ${output.totpWrongCode}
- tapOn:
    id: 'mfa-submit'
- assertVisible:
    id: 'mfa-notice'
- assertVisible:
    id: 'mfa-enroll-qr'
# Clear the failed entry, then enter a FRESH real code (the window may
# have rolled during the failure round-trip).
- tapOn:
    id: 'mfa-code'
- eraseText
- runScript: totp-code.js
- inputText: ${output.totpCode}
- tapOn:
    id: 'mfa-submit'
# reviewer.rae holds a single membership -> straight to Home at AAL2.
- assertVisible: 'Home'
- assertVisible:
    id: 'dashboard-workspace'
