appId: com.myhbcfo.hive.development
name: Storage quarantine blocks protected UI; scrub is the only recovery
# Pre-steps on the runner:
#   1. The installed development build was exported with
#      EXPO_PUBLIC_QA_HOOKS=1 (QA build). This enables the dev-only
#      storage-corruption deep link (hivedev://qa/corrupt-storage), which
#      release configuration forbids (config:check) and bundle inspection
#      proves absent from non-development exports.
#   2. The app is signed in (sign-in.yaml).
# The hook corrupts the stored session manifest; the next launch's
# verification fails closed into quarantine.
---
- launchApp
- assertVisible: 'Home'
- openLink: hivedev://qa/corrupt-storage
- stopApp
- launchApp
# No protected UI and no generic retry: only the scrub action exists.
- assertNotVisible: 'Home'
- assertVisible:
    id: 'quarantine-screen'
- assertVisible: 'Secure sign-in data needs a reset'
- assertNotVisible: 'Retry'
- tapOn: 'Reset secure sign-in data'
# Verified scrub lands on signed-out with the scrubbed notice; sign-in works.
- assertVisible: 'Secure sign-in data was reset. Sign in again to continue.'
- assertVisible: 'Email'
