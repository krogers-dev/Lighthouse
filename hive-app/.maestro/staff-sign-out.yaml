appId: com.myhbcfo.hive.development
name: Staff sign-out between enrollment and the subsequent login
tags:
  - milestone1
# Used ONLY by scripts/maestro-enroll-runner.mjs, between mfa-enroll.yaml
# and mfa-login.yaml, to return the staff account to a signed-out state so
# the login flow proves the EXISTING factor verifies from scratch.
#
# Why this is not sign-out.yaml: the two flows sign out two different
# identities, and the identities behave differently on resume.
# client.owner holds two memberships and is re-asked which workspace;
# reviewer.rae holds one and goes straight to Home. A single flow tried to
# cover both with an optional chooser step, and optional does not WAIT — on
# a resumed session it skipped past the chooser before it had rendered and
# then failed on the dashboard (find 34). Two identities, two flows, both
# deterministic. Since WO-013 the runner can sign in another synthetic
# staff identity (--as), and one with several memberships IS re-asked on
# resume: that branch is taken on the runner's word (QA_CHOOSE_SCOPE), as
# a conditional block that waits, never an optional step.
---
- launchApp
# An identity with more than one membership meets the workspace chooser
# here, where reviewer.rae goes straight to Home (WO-013). The runner
# signs in whichever synthetic staff identity the extra flow needs and
# says whether the chooser is due (QA_CHOOSE_SCOPE) and which row to tap
# (QA_SCOPE, the row's full accessibility label). Conditional rather than
# optional: optional does not WAIT, and skipped past the chooser before it
# rendered (find 34).
- runFlow:
    when:
      true: ${QA_CHOOSE_SCOPE == 'yes'}
    commands:
      - extendedWaitUntil:
          visible:
            text: 'Choose a workspace'
          timeout: 30000
      - tapOn: ${QA_SCOPE}
# A resumed session lands on Home. Bounded wait: a dev build fetches its
# bundle on a cold start and that is not instantaneous (find 31).
- extendedWaitUntil:
    visible:
      id: 'dashboard-workspace'
    timeout: 30000
- tapOn:
    id: 'nav-account'
- assertVisible:
    id: 'settings-screen'
# At 200% text this control can sit below the fold, and tap-by-id does not
# scroll (find 42, 2026-09-06 desktop run): bring it into view first. This
# completes at once when the control is already visible.
- scrollUntilVisible:
    element:
      id: 'settings-sign-out'
    direction: DOWN
    timeout: 20000
    speed: 40
    visibilityPercentage: 100
    centerElement: false
- tapOn:
    id: 'settings-sign-out'
- assertVisible:
    id: 'sign-in-email'
# The session must not survive a relaunch.
- stopApp
- launchApp
- assertVisible:
    id: 'sign-in-email'
- assertNotVisible:
    id: 'dashboard-workspace'
