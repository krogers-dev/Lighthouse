appId: com.myhbcfo.hive.development
name: Sign-out removes protected UI and survives relaunch signed out
---
- launchApp
# ScopeKey is memory-only by design (docs/data-classification.md), so a
# resumed session lands on the chooser rather than the last workspace.
- assertVisible: 'Choose a workspace'
- tapOn: 'Harbor Light Bakery LLC \(Synthetic\), Harbor Light Bakery LLC \(Synthetic\), Client access'
- assertVisible:
    id: 'dashboard-workspace'
- tapOn:
    id: 'nav-account'
- assertVisible:
    id: 'settings-screen'
- tapOn:
    id: 'settings-sign-out'
- assertVisible: 'Sign in with your authorized email. We will send a one-time code.'
# The session must not survive a relaunch.
- stopApp
- launchApp
- assertVisible: 'Sign in with your authorized email. We will send a one-time code.'
- assertNotVisible:
    id: 'dashboard-workspace'
