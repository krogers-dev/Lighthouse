appId: com.myhbcfo.hive.development
name: Offline shows the explicit offline state and recovers on retry (Android lane)
# setAirplaneMode is Android-only in Maestro; the iOS matrix covers this
# case manually (Control Center) with the same assertions.
---
- launchApp
# ScopeKey is memory-only by design (docs/data-classification.md), so a
# resumed session lands on the chooser rather than the last workspace.
# Bounded wait, not a bare assertion: a dev build fetches its bundle on a
# cold start (find 31), and the denied runner met exactly that race on the
# 2026-09-06 desktop run (find 41).
- extendedWaitUntil:
    visible:
      text: 'Choose a workspace'
    timeout: 30000
- tapOn: 'Harbor Light Bakery LLC \(Synthetic\), Client access'
- assertVisible:
    id: 'dashboard-workspace'
- setAirplaneMode: enabled
- tapOn:
    id: 'nav-account'
- assertVisible:
    id: 'settings-screen'
- back
- assertVisible:
    id: 'dashboard-workspace'
# Force a fresh read while offline: the dashboard shows the offline state,
# never stale content presented as current.
- tapOn:
    id: 'nav-account'
- assertVisible:
    id: 'settings-screen'
# At 200% text this control can sit below the fold, and tap-by-id does not
# scroll (find 42, 2026-09-06 desktop run): bring it into view first. This
# completes at once when the control is already visible.
- scrollUntilVisible:
    element:
      id: 'settings-switch-scope'
    direction: DOWN
    timeout: 20000
    speed: 40
    visibilityPercentage: 100
    centerElement: false
- tapOn:
    id: 'settings-switch-scope'
- assertVisible: 'Choose a workspace'
# Full accessibility label, parentheses escaped: Maestro matches text as a
# regex, and the client name alone appears in BOTH rows' subtitles.
- tapOn: 'Harbor Light Bakery LLC \(Synthetic\), Client access'
- assertVisible: 'You are offline'
- setAirplaneMode: disabled
- tapOn: 'Check connection'
- assertVisible:
    id: 'dashboard-workspace'
