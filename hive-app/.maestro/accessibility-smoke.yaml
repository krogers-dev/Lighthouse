appId: com.myhbcfo.hive.development
name: Accessibility smoke — labels present on the auth path
---
# Runs with the platform screen reader enabled in the device-lane matrix
# (VoiceOver / TalkBack); assertions here confirm the accessible labels the
# reader depends on are present and stable.
# From a CLEARED app state, always: the lane before may have left the app
# signed in (the denied runner does, by design), and this flow then met the
# workspace chooser instead of the sign-in screen on the 2026-09-07 desktop
# run (find 45). A cleared install boots slowly in a dev build (find 31):
# bounded wait, not a race.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'sign-in-email'
    timeout: 30000
- assertVisible: 'HIVE'
- assertVisible: 'Email'
- tapOn:
    id: 'sign-in-email'
- inputText: 'client.owner@example.invalid'
- assertVisible:
    id: 'sign-in-submit'
