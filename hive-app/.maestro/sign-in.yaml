appId: com.myhbcfo.hive.development
name: Invite-only OTP sign-in reaches the scoped dashboard
---
- launchApp:
    clearState: false
- assertVisible: 'Sign in with your authorized email. We will send a one-time code.'
- tapOn:
    id: 'sign-in-email'
- inputText: 'client.owner@example.invalid'
# Snapshot Mailpit BEFORE requesting the code: only a message that arrives
# after this point is accepted, so a stale code cannot be replayed.
- runScript:
    file: otp-snapshot.js
    env:
      QA_EMAIL: 'client.owner@example.invalid'
- tapOn:
    id: 'sign-in-submit'
- assertVisible: 'Enter your sign-in code'
- runScript:
    file: otp-fetch.js
    env:
      QA_EMAIL: 'client.owner@example.invalid'
- tapOn:
    id: 'otp-code'
- inputText: ${output.otpCode}
- tapOn:
    id: 'otp-submit'
# client.owner holds two memberships, so explicit scope selection is forced.
- assertVisible: 'Choose a workspace'
- tapOn: 'Harbor Light Bakery LLC (Synthetic).*'
- assertVisible: 'Home'
- assertVisible:
    id: 'dashboard-workspace'
