appId: com.myhbcfo.hive.development
name: Invite-only OTP sign-in reaches the scoped dashboard
---
# From a CLEARED app state, always: lanes run in any order, and the lane
# before may have left the app signed in — on the 2026-09-06 desktop run
# this flow met the workspace chooser instead of the sign-in screen. A
# cleared install boots slowly in a dev build (find 31): bounded wait, not
# a race.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'sign-in-email'
    timeout: 30000
- assertVisible:
    id: 'sign-in-email'
- tapOn:
    id: 'sign-in-email'
- inputText: 'client.owner@example.invalid'
# Snapshot Mailpit BEFORE requesting the code: only a message that arrives
# after this point is accepted, so a stale code cannot be replayed.
- runScript:
    file: otp-snapshot.js
    env:
      QA_EMAIL: 'client.owner@example.invalid'
- tapOn:
    id: 'sign-in-submit'
- assertVisible: 'Enter your sign-in code'
- runScript:
    file: otp-fetch.js
    env:
      QA_EMAIL: 'client.owner@example.invalid'
- tapOn:
    id: 'otp-code'
- inputText: ${output.otpCode}
- tapOn:
    id: 'otp-submit'
# client.owner holds two memberships, so explicit scope selection is forced.
- assertVisible: 'Choose a workspace'
# The row's full accessibility label — "<client>, <entity>, <role>" — is the
# only selector that names ONE row: both rows carry the same client name in
# their subtitle, so a client-name prefix would match the other entity too.
# Parentheses are escaped because Maestro matches text as a REGEX.
- tapOn: 'Harbor Light Bakery LLC \(Synthetic\), Client access'
- assertVisible:
    id: 'dashboard-workspace'
