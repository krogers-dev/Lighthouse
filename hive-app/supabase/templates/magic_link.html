<!-- HIVE local development sign-in code email (P0-1).
     GoTrue's default magic-link template sends a clickable link; HIVE's
     invite-only flow enters a six-digit code, so this template delivers
     {{ .Token }} and the black-box lane asserts sign-in without ever
     following a link. Synthetic/local use only. -->
<h2>Your HIVE sign-in code</h2>
<p>Enter this code in the HIVE app to continue:</p>
<p style="font-size: 28px; font-weight: 700; letter-spacing: 4px;">{{ .Token }}</p>
<p>This code expires in one hour. If you did not request it, you can ignore this email.</p>
